# Included in every location: nginx drops server-level add_header directives
# in any location that declares its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org https://services.arcgisonline.com; worker-src blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://services.arcgisonline.com; frame-ancestors 'none'" always;
