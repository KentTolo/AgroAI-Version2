# Render Blueprint for the AgroAI API (https://render.com/docs/blueprint-spec).
# Render builds backend/Dockerfile, which also trains the model. The database is external
# (Supabase); see docs/deployment/pilot.md for the full walkthrough.
services:
  - type: web
    name: agroai-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AGROAI_ENVIRONMENT
        value: production
      - key: AGROAI_SECRET_KEY
        generateValue: true
      # Supabase "Session pooler" connection string, with your database password filled in.
      - key: AGROAI_DATABASE_URL
        sync: false
      # Your email address: the account you register with it becomes the admin.
      - key: AGROAI_ADMIN_EMAILS
        sync: false
      # The website's origin (GitHub Pages), so browsers may call the API.
      - key: AGROAI_CORS_ORIGINS
        value: https://kenttolo.github.io
      - key: AGROAI_LOG_LEVEL
        value: INFO
      # WhatsApp via self-hosted WAHA (docs/deployment/whatsapp.md). Leave unset to turn it off.
      - key: AGROAI_WHATSAPP_PROVIDER
        sync: false
      - key: AGROAI_WAHA_URL
        sync: false
      - key: AGROAI_WAHA_API_KEY
        sync: false
      - key: AGROAI_WAHA_WEBHOOK_HMAC_KEY
        sync: false
      - key: AGROAI_WHATSAPP_BOT_NUMBER
        sync: false
      # Shared with the "Daily WhatsApp alerts" GitHub Action (secret AGROAI_CRON_SECRET).
      - key: AGROAI_CRON_SECRET
        sync: false
