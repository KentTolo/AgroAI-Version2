# WhatsApp gateway for AgroAI: WAHA (https://github.com/devlikeapro/waha, Apache-2.0) plus a free
# Tailscale Funnel, which gives WAHA a public HTTPS address without opening router ports.
#
# Run it on an always-on machine: an Oracle Cloud "Always Free" VM, an old PC or a Raspberry Pi.
# Setup steps: docs/deployment/whatsapp.md
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: agroai-waha
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    # Share the Tailscale container's network, so the funnel reaches WAHA on 127.0.0.1:3000.
    network_mode: service:tailscale
    depends_on: [tailscale]
    env_file: .env
    environment:
      # GOWS is WAHA's lightweight engine (no browser), suited to small machines.
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_START_SESSION: default
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_RETRIES_POLICY: constant
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "6"
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "20"
    volumes:
      - ./sessions:/app/.sessions
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
