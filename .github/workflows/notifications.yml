name: Daily WhatsApp alerts

# Once a day, asks the API to send each linked farmer their new milestones and alerts
# (growth stages, harvest, frost, heavy rain, silent sensor stations) over WhatsApp.
# GitHub's scheduler is free; it also wakes the API if Render's free plan put it to sleep.
#
# Needs the repository secret AGROAI_CRON_SECRET (the same value as the API's
# AGROAI_CRON_SECRET). The API address comes from the AGROAI_API_URL variable, or the pilot API.

on:
  schedule:
    - cron: "37 3 * * *" # 05:37 in Lesotho (UTC+2)
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.AGROAI_API_URL || 'https://agroai-api-c9cq.onrender.com' }}
      CRON_SECRET: ${{ secrets.AGROAI_CRON_SECRET }}
    steps:
      - name: Send today's alerts
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::AGROAI_CRON_SECRET is not set; skipping. See docs/deployment/whatsapp.md."
            exit 0
          fi
          # The first requests may time out while a sleeping free-tier server starts.
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 600 \
            -X POST "$API_URL/api/v1/internal/notifications/run" \
            -H "X-Cron-Secret: $CRON_SECRET"
          echo
