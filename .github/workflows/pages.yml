name: Deploy web app to GitHub Pages

# Publishes the web app to GitHub Pages in one of two modes:
#
# * Live (default): the app talks to the pilot API server, with real accounts and a shared
#   database. The repository variable AGROAI_API_URL overrides the server address.
# * Demo (when the repository variable AGROAI_DEMO is "true"): a browser-only build that answers
#   API requests in the browser (frontend/src/demo) and keeps each visitor's data there.
#
# Set variables under Settings -> Secrets and variables -> Actions -> Variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEMO: ${{ vars.AGROAI_DEMO == 'true' }}
      API_URL: ${{ vars.AGROAI_API_URL || 'https://agroai-api-c9cq.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        if: env.DEMO == 'true'
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Train the model and export demo assets
        if: env.DEMO == 'true'
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run python -m app.ml.train
          uv run python -m app.ml.export --out ../frontend/public/demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app (${{ env.DEMO == 'true' && 'demo' || 'live' }} mode)
        working-directory: frontend
        env:
          VITE_DEMO_MODE: ${{ env.DEMO }}
          VITE_API_URL: ${{ env.DEMO != 'true' && format('{0}/api/v1', env.API_URL) || '' }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          # Serve the app for deep links such as /app/fields, which have no file of their own.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
