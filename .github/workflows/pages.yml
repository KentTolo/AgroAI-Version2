name: Deploy web app to GitHub Pages

# Publishes the web app to GitHub Pages in one of two modes:
#
# * Live (when the repository variable AGROAI_API_URL is set, e.g. https://agroai-api.onrender.com):
#   the app talks to that API server, with real accounts and a shared database.
# * Demo (otherwise): a browser-only build that answers API requests in the browser
#   (frontend/src/demo) and keeps each visitor's data in their own browser.
#
# Set the variable under Settings -> Secrets and variables -> Actions -> Variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        if: vars.AGROAI_API_URL == ''
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Train the model and export demo assets
        if: vars.AGROAI_API_URL == ''
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run python -m app.ml.train
          uv run python -m app.ml.export --out ../frontend/public/demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app (${{ vars.AGROAI_API_URL && 'live' || 'demo' }} mode)
        working-directory: frontend
        env:
          VITE_DEMO_MODE: ${{ vars.AGROAI_API_URL == '' }}
          VITE_API_URL: ${{ vars.AGROAI_API_URL && format('{0}/api/v1', vars.AGROAI_API_URL) || '' }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          # Serve the app for deep links such as /app/fields, which have no file of their own.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
